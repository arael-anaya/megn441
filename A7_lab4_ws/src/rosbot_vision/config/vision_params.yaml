vision_node:
  ros__parameters:
    # The block size is armConfig.BLOCK_SIZE (rosbot_arm), shared with the stacker; nothing to set here.

    # Smallest color blob looked at (pixels). Block size is checked in meters afterwards.
    min_area: 60
    # Colored things whose top is higher than this above the table (gripper, robot parts) are not blocks
    max_block_height: 0.06
    # Each detect_blocks call looks at num_frames new frames and reports a color seen in at least 2 of them, at the
    # median position.
    num_frames: 5
    frame_timeout: 3.0

    # HSV ranges, 6 numbers per range: h_lo, s_lo, v_lo, h_hi, s_hi, v_hi (OpenCV hue is 0-179).
    # Lower s_lo / v_lo if a block is missed in shadow or glare; the depth check rejects flat things that match.
    # Retuned on the gray carpet: auto-exposure washes the top faces out (V=255), so red's top is only S~55 and blue's
    # top is cyan (H~90). The carpet is S<=15, so low saturation floors are still safe there.
    hsv_red:   [0, 35, 50, 12, 255, 255, 165, 35, 50, 179, 255, 255]
    hsv_green: [35, 50, 40, 87, 255, 255]
    hsv_blue:  [88, 40, 40, 130, 255, 255]
    # Accept a block from color alone when depth does not show it standing above the table. Its position still comes
    # from the color pixels projected onto the table plane; only the "is it raised" check is skipped.
    require_raised: false

    # When a requested block is not seen from where the arm is, back the arm up for a higher view and look again
    raise_when_missing: true
    # Every detect_blocks call saves its color / depth / annotated image and the camera pose it used here (the last
    # 30 are kept). Look at a miss afterwards with: ros2 run rosbot_vision replay_capture. '' turns it off.
    capture_dir: '~/.ros/vision_captures'
